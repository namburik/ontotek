# Single compose file for the whole OntoTek stack: OpenMetadata (catalog/
# lineage — postgresql, elasticsearch, server, ingestion) + Cube (query
# compiler). Originally merged from openmetadata/docker-compose.yml (MySQL
# backend) + cube/docker-compose.yml, then the OpenMetadata backend was
# swapped from MySQL to a dedicated Postgres container using upstream's
# docker-compose-postgres.yml as reference (fetched from the same GitHub
# release) — this is OpenMetadata's OWN internal metadata store, a separate
# Postgres server unrelated to the native mltek/sifttek Postgres instance.
# Auto-loads .env from this same directory (the project root).

volumes:
  ingestion-volume-dag-airflow:
    name: openmetadata_ingestion-volume-dag-airflow
  ingestion-volume-dags:
    name: openmetadata_ingestion-volume-dags
  ingestion-volume-tmp:
    name: openmetadata_ingestion-volume-tmp
  es-data:
    name: openmetadata_es-data

services:
  postgresql:
    container_name: openmetadata_postgresql
    image: docker.getcollate.io/openmetadata/postgresql:2.0.2
    restart: unless-stopped
    command: "--work_mem=10MB"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    expose:
      - 5432
    # No host port published — this is OpenMetadata's own internal metadata
    # store, a *separate* Postgres server running only inside this compose
    # network. Binding 5432 on the host would collide with the existing
    # native Postgres (mltek/sifttek/etc.) that Cube and the ingestion
    # connectors reach via host.docker.internal:5432 — this container is
    # unrelated to that instance and stays fully internal to app_net.
    volumes:
      - ./openmetadata/docker-volume/db-data-postgres:/var/lib/postgresql/data
    networks:
      - app_net
    healthcheck:
      test: psql -U postgres -tAc 'select 1' -d openmetadata_db
      interval: 15s
      timeout: 10s
      retries: 10

  elasticsearch:
    container_name: openmetadata_elasticsearch
    image: docker.elastic.co/elasticsearch/elasticsearch:9.3.0
    environment:
      - discovery.type=single-node
      - ES_JAVA_OPTS=-Xms1024m -Xmx1024m
      - xpack.security.enabled=false
    networks:
      - app_net
    ports:
      - "9200:9200"
      - "9300:9300"
    healthcheck:
      test: "curl -s http://localhost:9200/_cluster/health?pretty | grep status | grep -qE 'green|yellow' || exit 1"
      interval: 15s
      timeout: 10s
      retries: 10
    volumes:
      - es-data:/usr/share/elasticsearch/data

  execute-migrate-all:
