      OM_SM_ACCESS_KEY_ID: ${OM_SM_ACCESS_KEY_ID:-""}
      OM_SM_ACCESS_KEY: ${OM_SM_ACCESS_KEY:-""}
      OM_EMAIL_ENTITY: ${OM_EMAIL_ENTITY:-"OpenMetadata"}
      OM_SUPPORT_URL: ${OM_SUPPORT_URL:-"https://slack.open-metadata.org"}
      AUTHORIZER_ENABLE_SMTP : ${AUTHORIZER_ENABLE_SMTP:-false}
      OPENMETADATA_SERVER_URL: ${OPENMETADATA_SERVER_URL:-""}
      OPENMETADATA_SMTP_SENDER_MAIL: ${OPENMETADATA_SMTP_SENDER_MAIL:-""}
      SMTP_SERVER_ENDPOINT: ${SMTP_SERVER_ENDPOINT:-""}
      SMTP_SERVER_PORT: ${SMTP_SERVER_PORT:-""}
      SMTP_SERVER_USERNAME: ${SMTP_SERVER_USERNAME:-""}
      SMTP_SERVER_PWD: ${SMTP_SERVER_PWD:-""}
      SMTP_SERVER_STRATEGY: ${SMTP_SERVER_STRATEGY:-"SMTP_TLS"}
      OPENMETADATA_HEAP_OPTS: ${OPENMETADATA_HEAP_OPTS:--Xmx1G -Xms1G}
      MASK_PASSWORDS_API: ${MASK_PASSWORDS_API:-false}
      WEB_CONF_URI_PATH: ${WEB_CONF_URI_PATH:-"/api"}
      WEB_CONF_HSTS_ENABLED: ${WEB_CONF_HSTS_ENABLED:-false}
      WEB_CONF_HSTS_MAX_AGE: ${WEB_CONF_HSTS_MAX_AGE:-"365 days"}
      WEB_CONF_HSTS_INCLUDE_SUBDOMAINS: ${WEB_CONF_HSTS_INCLUDE_SUBDOMAINS:-"true"}
      WEB_CONF_HSTS_PRELOAD: ${WEB_CONF_HSTS_PRELOAD:-"true"}
      WEB_CONF_FRAME_OPTION_ENABLED: ${WEB_CONF_FRAME_OPTION_ENABLED:-false}
      WEB_CONF_FRAME_OPTION: ${WEB_CONF_FRAME_OPTION:-"SAMEORIGIN"}
      WEB_CONF_FRAME_ORIGIN: ${WEB_CONF_FRAME_ORIGIN:-""}
      WEB_CONF_CONTENT_TYPE_OPTIONS_ENABLED: ${WEB_CONF_CONTENT_TYPE_OPTIONS_ENABLED:-false}
      WEB_CONF_XSS_PROTECTION_ENABLED: ${WEB_CONF_XSS_PROTECTION_ENABLED:-false}
      WEB_CONF_XSS_PROTECTION_ON: ${WEB_CONF_XSS_PROTECTION_ON:-true}
      WEB_CONF_XSS_PROTECTION_BLOCK: ${WEB_CONF_XSS_PROTECTION_BLOCK:-true}
      WEB_CONF_XSS_CSP_ENABLED: ${WEB_CONF_XSS_CSP_ENABLED:-false}
      WEB_CONF_XSS_CSP_POLICY: ${WEB_CONF_XSS_CSP_POLICY:-"default-src 'self'"}
      WEB_CONF_XSS_CSP_REPORT_ONLY_POLICY: ${WEB_CONF_XSS_CSP_REPORT_ONLY_POLICY:-""}
      WEB_CONF_CACHE_CONTROL: ${WEB_CONF_CACHE_CONTROL:-""}
      WEB_CONF_PRAGMA: ${WEB_CONF_PRAGMA:-""}
    expose:
      - 8585
      - 8586
    ports:
      - "8585:8585"
      - "8586:8586"
    depends_on:
      elasticsearch:
        condition: service_healthy
      postgresql:
        condition: service_healthy
      execute-migrate-all:
        condition: service_completed_successfully
    networks:
      - app_net
    healthcheck:
      test: [ "CMD", "wget", "-q", "--spider",  "http://localhost:8586/healthcheck" ]

  ingestion:
    container_name: openmetadata_ingestion
    image: docker.getcollate.io/openmetadata/ingestion:2.0.2
    depends_on:
      elasticsearch:
        condition: service_started
      postgresql:
        condition: service_healthy
      openmetadata-server:
        condition: service_started
    environment:
      AIRFLOW__API__AUTH_BACKENDS: "airflow.api.auth.backend.basic_auth,airflow.api.auth.backend.session"
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__OPENMETADATA_AIRFLOW_APIS__DAG_GENERATED_CONFIGS: "/opt/airflow/dag_generated_configs"
      DB_HOST: ${AIRFLOW_DB_HOST:-postgresql}
      DB_PORT: ${AIRFLOW_DB_PORT:-5432}
      AIRFLOW_DB: ${AIRFLOW_DB:-airflow_db}
      DB_SCHEME: ${AIRFLOW_DB_SCHEME:-postgresql+psycopg2}
      DB_USER: ${AIRFLOW_DB_USER:-airflow_user}
      DB_PASSWORD: ${AIRFLOW_DB_PASSWORD:-airflow_pass}
      DB_PROPERTIES: ${AIRFLOW_DB_PROPERTIES:-}
    entrypoint: /bin/bash
    command:
      - "/opt/airflow/ingestion_dependency.sh"
    expose:
      - 8080
    ports:
      - "8080:8080"
    networks:
      - app_net
    volumes:
      - ingestion-volume-dag-airflow:/opt/airflow/dag_generated_configs
      - ingestion-volume-dags:/opt/airflow/dags
      - ingestion-volume-tmp:/tmp

  cube:
    image: cubejs/cube:v1.7.40
    container_name: ontotek_cube
    ports:
      - "4000:4000"   # REST/GraphQL API + dev-mode Playground UI
    environment:
      CUBEJS_DB_TYPE: postgres
      CUBEJS_DB_HOST: host.docker.internal
      CUBEJS_DB_PORT: "5432"
      CUBEJS_DB_NAME: mltek
      CUBEJS_DB_USER: ontotek_reader
      CUBEJS_DB_PASS: ${ONTOTEK_READER_PASSWORD}
      # Second datasource: the separate `sifttek` Postgres database (not a
      # schema inside mltek, so it needs its own connection). Cube cubes opt
      # into it via `data_source: sifttek` (see loader/cube/model/cubes/*.yml
      # for the 14 sifttek tables).
      CUBEJS_DATASOURCES: "default,sifttek,novatek"
      CUBEJS_DS_SIFTTEK_DB_TYPE: postgres
      CUBEJS_DS_SIFTTEK_DB_HOST: host.docker.internal
      CUBEJS_DS_SIFTTEK_DB_PORT: "5432"
      CUBEJS_DS_SIFTTEK_DB_NAME: sifttek
      CUBEJS_DS_SIFTTEK_DB_USER: sifttek_reader
      CUBEJS_DS_SIFTTEK_DB_PASS: ${SIFTTEK_READER_PASSWORD}
      # Third datasource: novatek's real movie_trends data (separate Postgres
      # database, same local cluster). Cube's Movietek* cube opts in via
      # `data_source: novatek` (see loader/cube/model/globals.py SCHEMA_INFO).
      CUBEJS_DS_NOVATEK_DB_TYPE: postgres
      CUBEJS_DS_NOVATEK_DB_HOST: host.docker.internal
      CUBEJS_DS_NOVATEK_DB_PORT: "5432"
      CUBEJS_DS_NOVATEK_DB_NAME: novatek
      CUBEJS_DS_NOVATEK_DB_USER: novatek_reader
      CUBEJS_DS_NOVATEK_DB_PASS: ${NOVATEK_READER_PASSWORD}
      CUBEJS_API_SECRET: ${CUBEJS_API_SECRET}
      CUBEJS_DEV_MODE: "true"
      # Used by loader/cube/model/globals.py to dynamically generate the
      # ontotek+sifttek data model live from OpenMetadata at Cube's own
      # startup (see that file for why: no hand-maintained YAML per table).
      # "localhost" would resolve to the cube container itself, so this uses
      # the compose network alias instead of the host-facing
      # OPENMETADATA_HOST_PORT from the root .env.
      CUBEJS_OM_INTERNAL_HOST: http://openmetadata-server:8585/api
      CUBEJS_OM_TOKEN: ${OPENMETADATA_JWT_TOKEN}
    volumes:
      - ./loader/cube/model:/cube/conf/model
    networks:
      - app_net

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ontotek_app
    restart: unless-stopped
    ports:
      # Loopback-only: the public :8765 is owned by ~/work_poc/ondemand, which
      # starts this stack on the first request and stops it when idle.
      - "127.0.0.1:18765:8765"
    environment:
      # "localhost" would resolve to this container itself -- same reasoning
      # as the cube service's CUBEJS_OM_INTERNAL_HOST above: OpenMetadata and
      # Cube are reached via their compose network alias, while the native
      # mltek/novatek/sifttek Postgres and host-local Ollama are reached via
      # host.docker.internal, same as CUBEJS_DB_HOST above.
      OPENMETADATA_HOST_PORT: http://openmetadata-server:8585/api
      OPENMETADATA_JWT_TOKEN: ${OPENMETADATA_JWT_TOKEN}
      OPENMETADATA_DB_SERVICE_NAME: ${OPENMETADATA_DB_SERVICE_NAME}
      POSTGRES_READ_ONLY_URI: postgresql://ontotek_reader:${ONTOTEK_READER_PASSWORD}@host.docker.internal:5432/mltek
      NOVATEK_READ_ONLY_URI: postgresql://novatek_reader:${NOVATEK_READER_PASSWORD}@host.docker.internal:5432/novatek
      SIFTTEK_READ_ONLY_URI: postgresql://sifttek_reader:${SIFTTEK_READER_PASSWORD}@host.docker.internal:5432/sifttek
      CUBE_API_URL: http://cube:4000/cubejs-api/v1
      CUBEJS_API_SECRET: ${CUBEJS_API_SECRET}
      OLLAMA_MODEL: ${OLLAMA_MODEL}
      OLLAMA_BASE_URL: http://host.docker.internal:11434
    depends_on:
      openmetadata-server:
        condition: service_healthy
      cube:
        condition: service_started
    networks:
      - app_net

networks:
  app_net:
    ipam:
      driver: default
      config:
        - subnet: "172.16.240.0/24"
